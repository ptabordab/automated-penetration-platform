version: '3'


#
#
# Services
#
#
services:

  #
  #
  # Infrastrucure
  #
  #

  splunk:
    image: splunk/splunk:latest
    container_name: splunk
    env_file:
      - .env
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD}
    ports:
      - "127.0.0.1:9000:8000"
      - "127.0.0.1:9088:8088"
    volumes:
      - splunk-data:/opt/splunk/var
    networks:
      virtual-net:
        ipv4_address: 172.18.1.3


  mongodb:
    image: mongo:latest
    container_name: my-mongodb
    ports:
      - "127.0.0.1:27017:27017"
    env_file:
      - .env
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGODB_INITDB_ROOT_USERNAME:-db_admin}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGODB_INITDB_ROOT_PASSWORD}
      MONGODB_INITDB_DATABASE: admin
    volumes:
      - mongodb_data:/data/db
    networks:
      virtual-net:
        ipv4_address: 172.18.1.4


  nessus:
    image: tenable/nessus:latest-ubuntu
    container_name: nessus
    ports:
      - "127.0.0.1:8834:8834"
    env_file:
      - .env
    environment:
      - ACCEPT_EULA=Y
      - NASL_CACHE_SIZE=200
      - NASL_CACHE_EXPIRATION=15m
      - NESSUS_UPDATE=1
      - USERNAME=${NESSUS_USERNAME:-nessus}
      - PASSWORD=${NESSUS_PASSWORD}
      - ACTIVATION_CODE=${NESSUS_ACTIVATION_CODE}
    volumes:
      - nessus_data:/opt/nessus/var/nessus
      - nessus_logs:/opt/nessus/var/nessus/logs
    restart: always
    networks:
      virtual-net:
        ipv4_address: 172.18.1.6

  metasploit: 
    image: metasploitframework/metasploit-framework
    container_name: metasploit
    command: bash -c "msfdb init && /bin/bash"
    ports:
      - "127.0.0.1:4444:4444"  # Metasploit RPC port
      - "127.0.0.1:8080:8080"  # Metasploit web UI port
    tty: true
    networks:
      virtual-net:
        ipv4_address: 172.18.1.7



  #
  #
  # Test Environment
  #
  #

  metasploitable2:
    image: tleemcjr/metasploitable2
    ports:
      - "127.0.0.1:2222:22"   # SSH
      - "127.0.0.1:9080:80"   # HTTP
      - "127.0.0.1:9443:443"  # HTTPS
      - "127.0.0.1:139:139"   # SMB
      - "127.0.0.1:445:445"   # SMB
    tty: true
    networks:
      virtual-net:
        ipv4_address: 172.18.1.5


#
#
# Networks
#
#
networks:
  virtual-net:
    name: virtual-net
    ipam:
      driver: default
      config:
        - subnet: "172.18.1.0/24"


volumes:
  splunk-data:
  mongodb_data:
  nessus_data:
  nessus_logs: